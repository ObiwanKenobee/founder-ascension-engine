
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
  </defs>

  <!-- Stars placement -->
  <g fill="white" opacity="0.8">
    <circle cx="100" cy="100" r="1" />
    <circle cx="200" cy="150" r="1.2" />
    <circle cx="300" cy="80" r="0.8" />
    <circle cx="400" cy="200" r="1" />
    <circle cx="500" cy="120" r="1.3" />
    <circle cx="600" cy="300" r="0.9" />
    <circle cx="700" cy="250" r="1.1" />
    <circle cx="150" cy="350" r="1" />
    <circle cx="250" cy="450" r="0.7" />
    <circle cx="350" cy="500" r="1.2" />
    <circle cx="450" cy="400" r="0.8" />
    <circle cx="550" cy="500" r="1" />
    <circle cx="650" cy="420" r="1.1" />
    <circle cx="120" cy="220" r="0.9" />
    <circle cx="320" cy="280" r="1" />
    <circle cx="520" cy="320" r="0.8" />
    <circle cx="620" cy="180" r="1.2" />
    <circle cx="180" cy="450" r="0.9" />
    <circle cx="380" cy="380" r="1" />
    <circle cx="580" cy="420" r="1.1" />
  </g>

  <!-- Constellation lines -->
  <g stroke="rgba(108, 99, 255, 0.2)" stroke-width="0.5" fill="none">
    <path d="M100,100 L200,150 L300,80 L400,200 L500,120" />
    <path d="M150,350 L250,450 L350,500 L450,400" />
    <path d="M500,120 L600,300 L700,250" />
    <path d="M120,220 L320,280 L520,320 L620,180" />
    <path d="M180,450 L380,380 L580,420" />
  </g>
</svg>
